name: Audit retention without deploying
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
  pull_request:
    paths: ['.github/scripts/**', '.github/workflows/**']
  push:
    branches: [develop]
    paths: ['.github/scripts/**', '.github/workflows/retention-guard.yml']
permissions:
  contents: read
concurrency:
  group: deploy-drivers-admin-production
  cancel-in-progress: false
  queue: max
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -B -m unittest discover -s .github/scripts -p 'test_*retention*.py'
  audit:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify native retention, protection and limits without mutations
        run: python3 .github/scripts/retention_guard.py --project new-drivers-test --hosting-site new-drivers-test --secrets
