name: Deploy admin web to Firebase Hosting

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '.github/scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-drivers-admin-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Test retention safeguards
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*retention*.py'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @rollup/rollup-linux-x64-gnu@4.22.4

      - name: Build production application
        run: npm run build -- --configuration production

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Gate deployment on Hosting retention and secret version limits
        run: python3 .github/scripts/retention_guard.py --project new-drivers-test --hosting-site new-drivers-test --secrets

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: >-
          npx --yes firebase-tools@15.22.1 deploy
          --only hosting
          --project new-drivers-test
          --non-interactive
      - name: Verify retention after successful release
        run: python3 .github/scripts/retention_guard.py --project new-drivers-test --hosting-site new-drivers-test --secrets
