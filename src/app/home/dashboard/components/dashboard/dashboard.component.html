<div class="dashboard-container">
  <app-toolbar (menuClick)="toggleMenu()"></app-toolbar>
  <mat-drawer-container class="main-dashboard">
    <mat-drawer #drawer mode="side" opened class="navigation-drawer">
      <div class="navigation-heading">OPERACIÓN</div>
      @for (destination of listDestinations; track $index) {
      <app-item-nav [navDestination]="destination"></app-item-nav>
      }
    </mat-drawer>
    <mat-drawer-content class="dashboard-content">
      @defer (on idle) {
        <router-outlet />
    }
    </mat-drawer-content>
  </mat-drawer-container>
</div>
