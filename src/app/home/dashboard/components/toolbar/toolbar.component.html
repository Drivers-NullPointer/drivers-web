<mat-toolbar class="app-toolbar">
    <button mat-icon-button class="toolbar-icon" aria-label="Abrir o cerrar navegación" (click)="menuClick.emit()">
      <mat-icon>menu</mat-icon>
    </button>
    <div class="brand">
      <span class="brand-mark">D</span>
      <span><strong>Drivers</strong><small>Centro de operaciones</small></span>
    </div>
    <span class="example-spacer"></span>
    <span class="admin-label">Administrador</span>
    <button mat-stroked-button class="logout-button" (click)="logout()" [disabled]="isLoggingOut()">
      <mat-icon>logout</mat-icon>
      Salir
    </button>
  </mat-toolbar>
